<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoMetka | Pixel Battle SLH</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --glass: rgba(15, 15, 15, 0.75);
            --accent: #00f2ff;
            --text: #ffffff;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        #map { height: 100vh; width: 100vw; filter: brightness(0.8) contrast(1.2); }

        /* Логотип GeoMetka */
        .logo {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            font-size: 24px; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            background: var(--glass); padding: 10px 20px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }

        /* Боковая панель (Топ и Онлайн) */
        .side-panel {
            position: absolute; top: 90px; left: 20px; z-index: 1000;
            width: 220px; background: var(--glass); color: var(--text);
            padding: 20px; border-radius: 15px; backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .panel-h { font-size: 14px; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; opacity: 0.9; }
        
        /* Нижняя панель управления */
        .bottom-ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--glass); padding: 15px 25px;
            border-radius: 20px; backdrop-filter: blur(20px);
            display: flex; align-items: center; gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 12px; border-radius: 8px; color: white; outline: none;
        }

        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; }
        .color-btn:hover { transform: scale(1.2); border-color: #fff; }

        .counter { font-size: 12px; color: var(--accent); text-align: center; margin-top: 5px; }

        /* Стиль карты */
        .leaflet-container { background: #0b0d10 !important; }
    </style>
</head>
<body>

    <div class="logo">GeoMetka</div>

    <div class="side-panel">
        <div class="panel-h">Онлайн: <span id="online-count">1</span></div>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 15px 0;">
        <div class="panel-h">Топ игроков</div>
        <div id="leaderboard">
            <div class="stat-row"><span>Загрузка...</span></div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-ui">
        <input type="text" id="nick" placeholder="Твой ник" maxlength="12">
        <div class="color-btn" onclick="currentColor='#ff4757'" style="background: #ff4757;"></div>
        <div class="color-btn" onclick="currentColor='#2ed573'" style="background: #2ed573;"></div>
        <div class="color-btn" onclick="currentColor='#1e90ff'" style="background: #1e90ff;"></div>
        <div class="color-btn" onclick="currentColor='#ffa502'" style="background: #ffa502;"></div>
        <div style="margin-left: 10px;">
            <div class="panel-h" style="margin:0">Твой счет</div>
            <div id="my-score" class="counter">0</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentColor = '#ff4757';
        let myScore = 0;
        const gridSize = 0.0004;
        const pixels = {};

        const map = L.map('map', { zoomControl: false }).setView([66.53, 66.61], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function updateLeaderboard(mapState) {
            const stats = {};
            Object.values(mapState).forEach(p => {
                stats[p.owner] = (stats[p.owner] || 0) + 1;
            });
            
            const sorted = Object.entries(stats).sort((a,b) => b[1] - a[1]).slice(0, 5);
            const html = sorted.map(([name, count]) => `
                <div class="stat-row"><span>${name}</span><b>${count}</b></div>
            `).join('');
            document.getElementById('leaderboard').innerHTML = html || '<div class="stat-row">Мир пуст...</div>';
            
            const myNick = document.getElementById('nick').value || 'Аноним';
            document.getElementById('my-score').innerText = stats[myNick] || 0;
        }

        function drawPixel(id, color, owner) {
            if (pixels[id]) map.removeLayer(pixels[id]);
            const [lat, lng] = id.split('_').map(Number);
            pixels[id] = L.rectangle([[lat, lng], [lat + gridSize, lng + gridSize]], {
                color: color, fillColor: color, fillOpacity: 0.8, weight: 0
            }).bindPopup(`Владелец: ${owner}`).addTo(map);
        }

        socket.on('init_map', (data) => {
            for (let id in data) drawPixel(id, data[id].color, data[id].owner);
            updateLeaderboard(data);
        });

        socket.on('pixel_updated', (data) => {
            drawPixel(data.id, data.color, data.username);
            // Запрашиваем обновленный топ (сервер должен будет пересчитать или мы сами тут)
        });

        socket.on('online_stats', (count) => {
            document.getElementById('online-count').innerText = count;
        });

        map.on('click', (e) => {
            const lat = Math.floor(e.latlng.lat / gridSize) * gridSize;
            const lng = Math.floor(e.latlng.lng / gridSize) * gridSize;
            const id = `${lat.toFixed(5)}_${lng.toFixed(5)}`;
            const nick = document.getElementById('nick').value || 'Аноним';
            socket.emit('paint_pixel', { id, color: currentColor, username: nick });
        });
    </script>
</body>
</html>
