<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka | Yandex Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --dark: #0f0f0f;
            --glass: rgba(25, 25, 25, 0.8);
            --accent: #00d2ff;
            --yandex-red: #ff3333;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--dark); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white; overflow: hidden;
        }

        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* UI ЭЛЕМЕНТЫ */
        .header-ui {
            position: absolute; top: 20px; left: 15px; right: 15px;
            z-index: 1000; display: flex; gap: 12px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            flex: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; margin-bottom: 4px;}
        .stat-val { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }

        /* СТИЛЬ МАРКЕРА "КАК В ЯНДЕКСЕ" */
        .user-marker-container {
            display: flex; justify-content: center; align-items: center;
        }

        /* Луч зрения (направление) */
        .view-cone {
            position: absolute;
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid rgba(0, 210, 255, 0.3);
            margin-top: -45px;
            transform-origin: bottom center;
            filter: blur(2px);
            transition: transform 0.1s linear;
        }

        .yandex-dot {
            width: 22px; height: 22px;
            background: var(--yandex-red);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        .yandex-dot::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .pulse-ring {
            position: absolute;
            width: 40px; height: 40px;
            border: 2px solid var(--yandex-red);
            border-radius: 50%;
            animation: ripple 2s infinite;
            opacity: 0;
        }

        @keyframes ripple {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Кнопка "Найти меня" */
        .recenter-btn {
            position: absolute; bottom: 120px; right: 20px;
            z-index: 1000; width: 55px; height: 55px;
            background: var(--glass); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }

        .recenter-btn svg { fill: white; width: 24px; height: 24px; }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="glass-card">
            <div class="stat-label">HUB ONLINE</div>
            <div class="stat-val" id="online-count">1</div>
        </div>
        <div class="glass-card">
            <div class="stat-label">TERRITORY</div>
            <div class="stat-val" id="my-score">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="recenter-btn" onclick="followMe()">
        <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let myUID = localStorage.getItem('p_uid') || 'U-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('p_uid', myUID);

        let isFollowing = true;
        let myMarker = null;
        let accuracyCircle = null;
        let headingLayer = null;
        let fullMapData = {};

        const map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            tap: false // Улучшает работу на мобилках
        }).setView([0, 0], 17);

        // Темная карта премиум-класса
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let zonesLayer = L.layerGroup().addTo(map);

        function followMe() {
            isFollowing = true;
            if (myMarker) map.flyTo(myMarker.getLatLng(), 18, { duration: 1 });
        }

        map.on('dragstart', () => isFollowing = false);

        // Настройка точного GPS
        map.locate({
            watch: true,
            enableHighAccuracy: true, 
            maximumAge: 0,
            timeout: 5000
        });

        map.on('locationfound', (e) => {
            const { lat, lng, accuracy } = e.latlng;

            if (!myMarker) {
                // Создаем маркер Яндекса
                const customIcon = L.divIcon({
                    className: 'user-marker-container',
                    html: `
                        <div class="view-cone" id="v-cone"></div>
                        <div class="pulse-ring"></div>
                        <div class="yandex-dot"></div>
                    `,
                    iconSize: [40, 40]
                });

                myMarker = L.marker([lat, lng], { icon: customIcon, zIndexOffset: 1000 }).addTo(map);
                accuracyCircle = L.circle([lat, lng], {
                    radius: accuracy,
                    color: '#00d2ff',
                    fillColor: '#00d2ff',
                    fillOpacity: 0.1,
                    weight: 1
                }).addTo(map);

                map.setView([lat, lng], 17);
            } else {
                myMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy);
                
                if (isFollowing) map.panTo([lat, lng]);
            }

            // Отправка на сервер
            socket.emit('update_position', { uid: myUID, lat, lng, color: '#ff3333' });
            checkAndPaint(lat, lng);
        });

        // Функция поворота "луча" (Compass)
        window.addEventListener('deviceorientationabsolute', (e) => {
            let heading = e.alpha || e.webkitCompassHeading;
            if (heading) {
                const cone = document.getElementById('v-cone');
                if (cone) {
                    // Яндекс-стиль: луч показывает направление
                    cone.style.transform = `rotate(${-heading}deg)`;
                }
            }
        }, true);

        // Логика захвата зон (как в твоем коде, но с оптимизацией)
        function checkAndPaint(lat, lng) {
            const latStep = 0.00045;
            const lngStep = latStep / Math.cos(lat * Math.PI / 180);
            const gLat = (Math.floor(lat / latStep) * latStep).toFixed(6);
            const gLng = (Math.floor(lng / lngStep) * lngStep).toFixed(6);
            const pId = `${gLat}_${gLng}`;

            if (!fullMapData[pId] || fullMapData[pId].owner !== myUID) {
                socket.emit('paint_pixel', { id: pId, color: '#ff3333', uid: myUID });
                fullMapData[pId] = { color: '#ff3333', owner: myUID };
                updateScore();
            }
        }

        function updateScore() {
            let count = Object.values(fullMapData).filter(p => p.owner === myUID).length;
            document.getElementById('my-score').innerText = count;
        }

        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });
    </script>
</body>
</html>
