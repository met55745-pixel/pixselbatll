<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoMetka Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #1a1a1a; --panel: rgba(35, 35, 35, 0.9); --accent: #5dade2; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Интерфейс */
        .ui-card {
            position: absolute; z-index: 1000; background: var(--panel);
            backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; color: #eee; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stats-box { top: 15px; left: 15px; min-width: 140px; }
        .controls-box { bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; }

        /* Маркеры */
        .my-marker {
            width: 18px; height: 18px; background: white; border-radius: 50%;
            border: 3px solid var(--accent); box-shadow: 0 0 20px var(--accent);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .other-marker { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; }

        .color-btn { width: 35px; height: 35px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .color-btn.active { border-color: white; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="ui-card stats-box">
        <div style="font-size: 10px; color: var(--accent);">ОНЛАЙН</div>
        <div id="online-count" style="font-size: 18px; font-weight: bold;">0</div>
        <div id="my-score" style="margin-top: 5px; font-size: 12px; opacity: 0.8;">Захвачено: 0</div>
    </div>

    <div id="map"></div>

    <div class="ui-card controls-box">
        <div class="color-btn active" onclick="setCol('#ff4757', this)" style="background: #ff4757;"></div>
        <div class="color-btn" onclick="setCol('#2ed573', this)" style="background: #2ed573;"></div>
        <div class="color-btn" onclick="setCol('#1e90ff', this)" style="background: #1e90ff;"></div>
        <div class="color-btn" onclick="setCol('#eccc68', this)" style="background: #eccc68;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const gridSize = 0.0004;
        let myUID = localStorage.getItem('p_uid') || 'U-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        localStorage.setItem('p_uid', myUID);

        let currentColor = '#ff4757';
        let pixels = {};
        let otherPlayers = {};
        let myMarker = null;

        // Инициализация карты без лишних жестов
        const map = L.map('map', { 
            zoomControl: false, 
            doubleClickZoom: false, 
            boxZoom: false,
            dragging: true 
        }).setView([66.53, 66.61], 16);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function setCol(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // Отрисовка захваченных зон
        socket.on('init_map', (data) => {
            for (let id in data) drawRect(id, data[id].color);
        });

        socket.on('pixel_updated', (data) => {
            drawRect(data.id, data.color);
        });

        function drawRect(id, color) {
            if (pixels[id]) map.removeLayer(pixels[id]);
            const [lat, lng] = id.split('_').map(Number);
            pixels[id] = L.rectangle([[lat, lng], [lat + gridSize, lng + gridSize]], {
                color: color, fillColor: color, fillOpacity: 0.6, weight: 0
            }).addTo(map);
        }

        // ГЛАВНАЯ СИСТЕМА GPS
        map.locate({
            watch: true, 
            enableHighAccuracy: true, // Максимальная точность
            maximumAge: 1000,         // Кэш позиции не дольше 1 сек
            timeout: 10000            // Ждать сигнал 10 сек
        });

        map.on('locationfound', (e) => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // 1. Обновляем свой маркер (Метка персонажа)
            if (!myMarker) {
                myMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'my-marker', iconSize: [18, 18] })
                }).addTo(map).bindTooltip("ЭТО ТЫ", { permanent: true, direction: 'top' });
                map.panTo([lat, lng]);
            } else {
                myMarker.setLatLng([lat, lng]);
            }

            // 2. Отправляем позицию на сервер раз в сек
            socket.emit('update_position', { uid: myUID, lat, lng, color: currentColor });

            // 3. Красим клетку под ногами
            const gLat = Math.floor(lat / gridSize) * gridSize;
            const gLng = Math.floor(lng / gridSize) * gridSize;
            const pId = `${gLat.toFixed(5)}_${gLng.toFixed(5)}`;
            socket.emit('paint_pixel', { id: pId, color: currentColor, uid: myUID });
        });

        // Отображение других игроков
        socket.on('players_nearby', (list) => {
            for (let id in list) {
                if (id === myUID) continue;
                const p = list[id];
                if (otherPlayers[id]) {
                    otherPlayers[id].setLatLng([p.lat, p.lng]);
                } else {
                    otherPlayers[id] = L.marker([p.lat, p.lng], {
                        icon: L.divIcon({ 
                            className: 'other-marker', 
                            html: `<div style="background:${p.color}; width:100%; height:100%; border-radius:50%;"></div>`,
                            iconSize: [12, 12] 
                        })
                    }).addTo(map);
                }
            }
            // Удаляем ушедших
            for (let id in otherPlayers) {
                if (!list[id]) { map.removeLayer(otherPlayers[id]); delete otherPlayers[id]; }
            }
        });

        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });

        // Wake Lock (чтобы экран не гас в APK)
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
