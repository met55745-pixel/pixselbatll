<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka | Pro Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --dark: #121212;
            --glass: rgba(30, 30, 30, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #00d2ff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--dark); 
            font-family: -apple-system, system-ui, sans-serif;
            color: white; overflow: hidden;
        }

        #map { height: 100vh; width: 100vw; z-index: 1; background: #000; }

        /* UI Элементы */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-ui {
            position: absolute; top: 20px; left: 15px; right: 15px;
            z-index: 1000; display: flex; gap: 10px;
        }

        .stat-box { flex: 1; padding: 12px; text-align: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 700; opacity: 0.9; }
        .stat-val { font-size: 18px; font-weight: 900; margin-top: 2px; }

        .bottom-ui {
            position: absolute; bottom: 35px; left: 15px; right: 15px;
            z-index: 1000; display: flex; flex-direction: column; gap: 15px;
        }

        .color-picker { display: flex; justify-content: space-around; padding: 18px; }
        .color-node {
            width: 45px; height: 45px; border-radius: 50%;
            border: 3px solid transparent; transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .color-node.active { border-color: white; transform: scale(1.15); }

        /* Кнопка "Где я?" */
        .locate-btn {
            position: absolute; right: 15px; bottom: 130px;
            width: 50px; height: 50px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; z-index: 1000; cursor: pointer;
        }

        /* Кастомный маркер */
        .my-marker {
            width: 20px; height: 20px; background: white; border-radius: 50%;
            border: 4px solid var(--accent); box-shadow: 0 0 20px var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.2); filter: brightness(1.3); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        
        .accuracy-circle {
            border: 2px solid var(--accent);
            background: rgba(0, 210, 255, 0.15);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="glass-card stat-box">
            <div class="stat-label">Игроки</div>
            <div class="stat-val" id="online-count">0</div>
        </div>
        <div class="glass-card stat-box">
            <div class="stat-label">Точность</div>
            <div id="gps-accuracy" class="stat-val">--</div>
        </div>
        <div class="glass-card stat-box">
            <div class="stat-label">Зоны</div>
            <div class="stat-val" id="my-score">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="glass-card locate-btn" onclick="recenter()">📍</div>

    <div class="bottom-ui">
        <div class="glass-card color-picker">
            <div class="color-node active" onclick="setCol('#ff4757', this)" style="background: #ff4757;"></div>
            <div class="color-node" onclick="setCol('#2ed573', this)" style="background: #2ed573;"></div>
            <div class="color-node" onclick="setCol('#1e90ff', this)" style="background: #1e90ff;"></div>
            <div class="color-node" onclick="setCol('#ffa502', this)" style="background: #ffa502;"></div>
            <div class="color-node" onclick="setCol('#a29bfe', this)" style="background: #a29bfe;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const gridSize = 0.0004;
        let myUID = localStorage.getItem('p_uid') || 'P-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('p_uid', myUID);

        let currentColor = '#ff4757';
        let pixels = {};
        let otherPlayers = {};
        let myMarker = null;
        let accuracyCircle = null;
        let fullMapData = {};
        let lastPos = null;

        const map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            doubleClickZoom: false
        }).setView([66.53, 66.61], 17);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function setCol(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-node').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function recenter() {
            if (lastPos) map.flyTo(lastPos, 18);
        }

        socket.on('init_map', (data) => {
            fullMapData = data;
            for (let id in data) drawRect(id, data[id].color);
            updateScore();
        });

        socket.on('pixel_updated', (data) => {
            fullMapData[data.id] = { color: data.color, owner: data.uid };
            drawRect(data.id, data.color);
            updateScore();
        });

        function drawRect(id, color) {
            if (pixels[id]) map.removeLayer(pixels[id]);
            const [lat, lng] = id.split('_').map(Number);
            pixels[id] = L.rectangle([[lat, lng], [lat + gridSize, lng + gridSize]], {
                color: color, fillColor: color, fillOpacity: 0.5, weight: 0
            }).addTo(map);
        }

        function updateScore() {
            let count = Object.values(fullMapData).filter(p => p.owner === myUID).length;
            document.getElementById('my-score').innerText = count;
        }

        // ЖЕСТКАЯ GPS СИСТЕМА
        map.locate({ 
            watch: true, 
            enableHighAccuracy: true, 
            maximumAge: 0,
            timeout: 10000 
        });

        map.on('locationfound', (e) => {
            const { lat, lng } = e.latlng;
            lastPos = e.latlng;
            
            // Обновляем текст точности
            const acc = Math.round(e.accuracy);
            document.getElementById('gps-accuracy').innerText = acc + 'м';
            document.getElementById('gps-accuracy').style.color = acc < 20 ? '#2ed573' : '#ffa502';

            // Если точность совсем плохая (>50м), просто ждем нормальный сигнал
            if (acc > 50) return;

            // Двигаем маркер персонажа
            if (!myMarker) {
                myMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'my-marker', iconSize: [20, 20] }),
                    zIndexOffset: 1000
                }).addTo(map);
                
                accuracyCircle = L.circle([lat, lng], {
                    radius: e.accuracy,
                    className: 'accuracy-circle',
                    weight: 1, interactive: false
                }).addTo(map);
                
                map.setView([lat, lng], 18);
            } else {
                myMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(e.accuracy);
            }

            // Шлем координаты другим
            socket.emit('update_position', { uid: myUID, lat, lng, color: currentColor });

            // Красим сетку
            const gLat = Math.floor(lat / gridSize) * gridSize;
            const gLng = Math.floor(lng / gridSize) * gridSize;
            const pId = `${gLat.toFixed(5)}_${gLng.toFixed(5)}`;
            
            // Красим только если клетка чужая или пустая
            if (!fullMapData[pId] || fullMapData[pId].owner !== myUID) {
                socket.emit('paint_pixel', { id: pId, color: currentColor, uid: myUID });
            }
        });

        socket.on('players_nearby', (list) => {
            for (let id in list) {
                if (id === myUID) continue;
                const p = list[id];
                if (otherPlayers[id]) {
                    otherPlayers[id].setLatLng([p.lat, p.lng]);
                } else {
                    otherPlayers[id] = L.marker([p.lat, p.lng], {
                        icon: L.divIcon({ 
                            className: 'other-marker', 
                            html: `<div style="background:${p.color}; width:100%; height:100%; border-radius:50%;"></div>`,
                            iconSize: [14, 14] 
                        })
                    }).addTo(map);
                }
            }
            for (let id in otherPlayers) {
                if (!list[id]) { map.removeLayer(otherPlayers[id]); delete otherPlayers[id]; }
            }
        });

        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });

        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
