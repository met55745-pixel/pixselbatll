<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka | Mobile Battle</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --dark: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.9);
            --accent: #00d2ff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--dark); 
            font-family: -apple-system, sans-serif;
            color: white; overflow: hidden;
        }

        #map { height: 100vh; width: 100vw; background: #000; }

        /* UI */
        .header-ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            z-index: 1000; display: flex; gap: 10px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 12px;
            flex: 1;
            text-align: center;
        }

        .stat-label { font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: 900; }

        .bottom-ui {
            position: absolute; bottom: 30px; left: 0; right: 0;
            z-index: 1000; display: flex; justify-content: center;
        }

        .color-picker {
            display: flex; gap: 15px; padding: 12px 20px;
            background: var(--glass); border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .color-node {
            width: 35px; height: 35px; border-radius: 50%;
            border: 2px solid transparent; transition: 0.2s;
        }

        .color-node.active { border-color: white; transform: scale(1.2); }

        /* МАРКЕР */
        .red-dot {
            width: 18px; height: 18px; 
            background: #ff4757; 
            border: 3px solid white; 
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="glass-card">
            <div class="stat-label">Online</div>
            <div class="stat-val" id="online-count">1</div>
        </div>
        <div class="glass-card">
            <div class="stat-label">Score</div>
            <div class="stat-val" id="my-score">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-ui">
        <div class="color-picker">
            <div class="color-node active" onclick="setCol('#ff4757', this)" style="background: #ff4757;"></div>
            <div class="color-node" onclick="setCol('#2ed573', this)" style="background: #2ed573;"></div>
            <div class="color-node" onclick="setCol('#1e90ff', this)" style="background: #1e90ff;"></div>
            <div class="color-node" onclick="setCol('#ffa502', this)" style="background: #ffa502;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let myUID = localStorage.getItem('p_uid') || 'P-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('p_uid', myUID);

        let currentColor = '#ff4757';
        let fullMapData = {};
        let myMarker = null;

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        const countryLayers = L.layerGroup().addTo(map);

        // Константа сетки (50 метров)
        const latStep = 0.00045; 

        function setCol(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-node').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // Отрисовка зон
        function redrawCountries() {
            countryLayers.clearLayers();
            const colorGroups = {};

            // Группируем квадраты по цветам
            for (let id in fullMapData) {
                const col = fullMapData[id].color;
                if (!colorGroups[col]) colorGroups[col] = [];

                const [lat, lng] = id.split('_').map(Number);
                const lStep = latStep / Math.cos(lat * Math.PI / 180);

                // Создаем полигон для каждого «пикселя»
                const poly = turf.polygon([[
                    [lng, lat],
                    [lng + lStep, lat],
                    [lng + lStep, lat + latStep],
                    [lng, lat + latStep],
                    [lng, lat]
                ]]);
                colorGroups[col].push(poly);
            }

            // Рисуем каждую цветовую группу
            for (let col in colorGroups) {
                try {
                    const collection = turf.featureCollection(colorGroups[col]);
                    const dissolved = turf.dissolve(collection);

                    L.geoJSON(dissolved, {
                        style: {
                            color: col,
                            weight: 2,
                            fillColor: col,
                            fillOpacity: 0.4
                        }
                    }).addTo(countryLayers);
                } catch (e) {
                    console.error("Ошибка Turf:", e);
                }
            }
        }

        // GPS логика
        map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 1000 });

        map.on('locationfound', (e) => {
            const { lat, lng } = e.latlng;

            if (!myMarker) {
                myMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'red-dot', iconSize: [18, 18] })
                }).addTo(map);
                map.setView([lat, lng], 17);
            } else {
                myMarker.setLatLng([lat, lng]);
            }

            // Сетка
            const lStep = latStep / Math.cos(lat * Math.PI / 180);
            const gLat = (Math.floor(lat / latStep) * latStep).toFixed(6);
            const gLng = (Math.floor(lng / lStep) * lStep).toFixed(6);
            const pId = `${gLat}_${gLng}`;

            // Закрашиваем, если зона пустая или не наша
            if (!fullMapData[pId] || fullMapData[pId].owner !== myUID) {
                fullMapData[pId] = { color: currentColor, owner: myUID };
                socket.emit('paint_pixel', { id: pId, color: currentColor, uid: myUID });
                redrawCountries();
                updateScore();
            }

            socket.emit('update_position', { uid: myUID, lat, lng, color: currentColor });
        });

        function updateScore() {
            const count = Object.values(fullMapData).filter(p => p.owner === myUID).length;
            document.getElementById('my-score').innerText = count;
        }

        socket.on('init_map', (data) => { fullMapData = data; redrawCountries(); updateScore(); });
        socket.on('pixel_updated', (data) => { fullMapData[data.id] = { color: data.color, owner: data.uid }; redrawCountries(); updateScore(); });
        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });

    </script>
</body>
</html>
