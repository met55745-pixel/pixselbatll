<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka | Absolute Precision</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --accent: #00f2ff;
            --glass: rgba(10, 10, 10, 0.9);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000; overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        #map { height: 100vh; width: 100vw; }

        /* UI */
        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            z-index: 1000; display: flex; justify-content: space-between;
            pointer-events: none;
        }

        .status-box {
            background: var(--glass);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 10px 15px; border-radius: 8px;
            backdrop-filter: blur(10px); pointer-events: auto;
        }

        .label { font-size: 9px; color: var(--accent); font-weight: 800; text-transform: uppercase; }
        .val { font-size: 18px; font-weight: 900; color: #fff; }

        /* МАРКЕР И ЛУЧ */
        .player-container { position: relative; width: 0; height: 0; }
        
        /* Тот самый "Луч" */
        .view-cone {
            position: absolute; bottom: 0; left: 50%;
            width: 120px; height: 160px;
            background: conic-gradient(from -30deg, rgba(0, 242, 255, 0.4) 0deg, rgba(0, 242, 255, 0) 60deg);
            transform-origin: bottom center;
            transform: translate(-50%, 0) rotate(0deg);
            filter: blur(4px); pointer-events: none;
            z-index: -1;
        }

        .player-core {
            width: 16px; height: 16px; 
            background: #fff; border: 3px solid var(--accent);
            border-radius: 50%; box-shadow: 0 0 20px var(--accent);
        }

        .controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; gap: 15px; z-index: 1000;
        }

        .c-node {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .c-node.active { transform: scale(1.2); border-color: #fff; box-shadow: 0 0 15px currentColor; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="status-box">
            <div class="label">Accuracy</div>
            <div id="acc-val" class="val">0m</div>
        </div>
        <div class="status-box">
            <div class="label">Points</div>
            <div id="score" class="val">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <div class="c-node active" style="background: #ff4757;" data-color="#ff4757"></div>
        <div class="c-node" style="background: #2ed573;" data-color="#2ed573"></div>
        <div class="c-node" style="background: #1e90ff;" data-color="#1e90ff"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let myColor = '#ff4757';
        let mapData = {};
        let myUID = 'G-' + Math.random().toString(36).substr(2, 5).toUpperCase();

        const map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            // Фишка для плавности:
            zoomSnap: 0.1,
            easeLinearity: 0.1
        }).setView([0,0], 19);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        const paintLayer = L.layerGroup().addTo(map);

        let playerMarker, coneEl;

        // --- УЛЬТРА GPS ЛОГИКА ---
        const geoOptions = {
            enableHighAccuracy: true, // Включаем железный GPS
            maximumAge: 0,            // НИКАКОГО КЭША, только свежие данные
            timeout: 10000            // Ждем спутник до победного
        };

        map.locate({ watch: true, ...geoOptions });

        map.on('locationfound', (e) => {
            const { lat, lng, accuracy } = e.latlng;
            document.getElementById('acc-val').innerText = Math.round(accuracy) + 'm';

            if (!playerMarker) {
                const container = L.DomUtil.create('div', 'player-container');
                container.innerHTML = `<div class="view-cone"></div><div class="player-core"></div>`;
                
                playerMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ html: container, className: '', iconSize: [0, 0] }),
                    zIndexOffset: 1000
                }).addTo(map);

                coneEl = container.querySelector('.view-cone');
                map.setView([lat, lng], 19);
            } else {
                // Привязка "Точь-в-точь"
                playerMarker.setLatLng([lat, lng]);
                // Центрируем камеру за игроком
                map.panTo([lat, lng], { animate: true, duration: 0.5 });
            }

            // Механика захвата (сетка 50м)
            processCapture(lat, lng);
        });

        // Поворот "Луча" через компас
        window.addEventListener('deviceorientation', (e) => {
            if (e.alpha !== null && coneEl) {
                const heading = 360 - e.alpha;
                coneEl.style.transform = `translate(-50%, 0) rotate(${heading}deg)`;
            }
        }, true);

        // --- ЛОГИКА СЕТКИ ---
        const step = 0.00045; 

        function processCapture(lat, lng) {
            const lngStep = step / Math.cos(lat * Math.PI / 180);
            const sLat = (Math.floor(lat / step) * step).toFixed(6);
            const sLng = (Math.floor(lng / lngStep) * lngStep).toFixed(6);
            const id = `${sLat}_${sLng}`;

            if (!mapData[id] || mapData[id].uid !== myUID) {
                mapData[id] = { color: myColor, uid: myUID };
                socket.emit('claim', { id, color: myColor, uid: myUID });
                renderMap();
            }
        }

        function renderMap() {
            paintLayer.clearLayers();
            const colorGroups = {};

            for (let id in mapData) {
                const c = mapData[id];
                if (!colorGroups[c.color]) colorGroups[c.color] = [];
                
                const [lt, lg] = id.split('_').map(Number);
                const lStep = step / Math.cos(lt * Math.PI / 180);

                colorGroups[c.color].push(turf.polygon([[
                    [lg, lt], [lg + lStep, lt], [lg + lStep, lt + step], [lg, lt + step], [lg, lt]
                ]]));
            }

            for (let col in colorGroups) {
                const dissolved = turf.dissolve(turf.featureCollection(colorGroups[col]));
                L.geoJSON(dissolved, {
                    style: { color: col, weight: 2, fillColor: col, fillOpacity: 0.5 }
                }).addTo(paintLayer);
            }
            document.getElementById('score').innerText = Object.values(mapData).filter(x => x.uid === myUID).length;
        }

        // Выбор цвета
        document.querySelectorAll('.c-node').forEach(n => {
            n.onclick = () => {
                document.querySelectorAll('.c-node').forEach(b => b.classList.remove('active'));
                n.classList.add('active');
                myColor = n.dataset.color;
            }
        });

        socket.on('update', (data) => { mapData = data; renderMap(); });
    </script>
</body>
</html>
