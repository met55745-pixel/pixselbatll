<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka | Mobile Elite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --dark: #121212;
            --glass: rgba(30, 30, 30, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #00d2ff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--dark); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white; overflow: hidden;
            user-select: none; /* Защита от случайного выделения в APK */
        }

        #map { height: 100vh; width: 100vw; z-index: 1; background: #000; }

        /* ПЛАВНОСТЬ МАРКЕРОВ */
        .leaflet-marker-icon {
            transition: transform 0.5s linear !important;
        }

        .header-ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            z-index: 1000; display: flex; justify-content: space-between; align-items: center;
            gap: 10px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            flex: 1;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); opacity: 0.9; font-weight: 700;}
        .stat-val { font-size: 18px; font-weight: 800; margin-top: 2px; }

        .bottom-ui {
            position: absolute; bottom: 30px; left: 15px; right: 15px;
            z-index: 1000; display: flex; flex-direction: column; gap: 15px;
        }

        .color-picker {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px;
        }

        .color-node {
            width: 40px; height: 40px; border-radius: 50%;
            border: 3px solid transparent; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative; cursor: pointer;
        }

        .color-node.active { border-color: white; transform: scale(1.15); }
        
        /* Маркер игрока */
        .my-marker {
            width: 18px; height: 18px; background: white; border-radius: 50%;
            border: 4px solid var(--accent); box-shadow: 0 0 20px var(--accent);
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
            50% { transform: scale(1.2); box-shadow: 0 0 25px var(--accent); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
        }

        .other-marker { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="glass-card stat-item">
            <div class="stat-label">Онлайн</div>
            <div class="stat-val" id="online-count">0</div>
        </div>
        <div class="glass-card stat-item">
            <div class="stat-label">Твои Зоны</div>
            <div class="stat-val" id="my-score">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-ui">
        <div class="glass-card color-picker">
            <div class="color-node active" onclick="setCol('#ff4757', this)" style="background: #ff4757;"></div>
            <div class="color-node" onclick="setCol('#2ed573', this)" style="background: #2ed573;"></div>
            <div class="color-node" onclick="setCol('#1e90ff', this)" style="background: #1e90ff;"></div>
            <div class="color-node" onclick="setCol('#ffa502', this)" style="background: #ffa502;"></div>
            <div class="color-node" onclick="setCol('#a29bfe', this)" style="background: #a29bfe;"></div>
        </div>
    </div>

    <!-- Библиотека карт Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Подключаем Turf.js для вычисления общих границ "государств" -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        let myUID = localStorage.getItem('p_uid') || 'P-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('p_uid', myUID);

        let currentColor = '#ff4757';
        let otherPlayers = {};
        let myMarker = null;
        let fullMapData = {};

        // Базовые настройки карты
        const map = L.map('map', { 
            zoomControl: false, attributionControl: false, doubleClickZoom: false 
        }).setView([66.53, 66.61], 17);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Слой, где будут рисоваться наши "государства"
        let countryLayers = L.layerGroup().addTo(map);

        // Математика сетки: 50 метров (в градусах)
        const latStep = 0.00045; // ~50м в высоту
        let lngStep = latStep;   // Заглушка, обновится по первому фиксу GPS

        function setCol(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-node').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // Функция объединения квадратов в "государства"
        function redrawCountries() {
            countryLayers.clearLayers();
            let colorGroups = {};
            
            for(let id in fullMapData) {
                let col = fullMapData[id].color;
                if(!colorGroups[col]) colorGroups[col] = [];
                
                let parts = id.split('_');
                let lat = parseFloat(parts[0]);
                let lng = parseFloat(parts[1]);
                
                // Создаем полигон-квадрат
                let poly = turf.polygon([[
                    [lng, lat],
                    [lng + lngStep, lat],
                    [lng + lngStep, lat + latStep],
                    [lng, lat + latStep],
                    [lng, lat]
                ]], { color: col });
                
                colorGroups[col].push(poly);
            }

            for(let col in colorGroups) {
                let fc = turf.featureCollection(colorGroups[col]);
                // Turf растворяет внутренние границы (dissolve), оставляя только внешний контур!
                try {
                    let dissolved = turf.dissolve(fc);
                    
                    L.geoJSON(dissolved, {
                        style: {
                            color: col,        // Цвет обводки
                            weight: 3,         // Жирный край
                            opacity: 1,        // Яркий контур
                            fillColor: col,
                            fillOpacity: 0.35  // Легкая заливка внутри
                        },
                        interactive: false // Чтобы сквозь них работал клик
                    }).addTo(countryLayers);
                } catch (e) {
                    console.error("Ошибка отрисовки зоны", e);
                }
            }
        }

        socket.on('init_map', (data) => {
            fullMapData = data;
            redrawCountries();
            updateScore();
        });

        socket.on('pixel_updated', (data) => {
            fullMapData[data.id] = { color: data.color, owner: data.uid };
            redrawCountries();
            updateScore();
        });

        function updateScore() {
            let count = Object.values(fullMapData).filter(p => p.owner === myUID).length;
            document.getElementById('my-score').innerText = count;
        }

        // GPS СИСТЕМА
        map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 1000 });

        map.on('locationfound', (e) => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // Расчет шага долготы (компенсирует кривизну Земли, делает квадрат квадратом!)
            lngStep = latStep / Math.cos(lat * Math.PI / 180);

            if (!myMarker) {
                myMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'my-marker', iconSize: [18, 18] })
                }).addTo(map);
                map.setView([lat, lng], 17);
            } else {
                myMarker.setLatLng([lat, lng]); // Двигается плавно благодаря CSS
            }

            socket.emit('update_position', { uid: myUID, lat, lng, color: currentColor });

            // Привязка к сетке
            const gLat = (Math.floor(lat / latStep) * latStep).toFixed(6);
            const gLng = (Math.floor(lng / lngStep) * lngStep).toFixed(6);
            const pId = `${gLat}_${gLng}`;
            
            if (!fullMapData[pId] || fullMapData[pId].owner !== myUID) {
                socket.emit('paint_pixel', { id: pId, color: currentColor, uid: myUID });
                // Локальная пред-отрисовка (чтобы не ждать ответа сервера)
                fullMapData[pId] = { color: currentColor, owner: myUID };
                redrawCountries();
                updateScore();
            }
        });

        socket.on('players_nearby', (list) => {
            for (let id in list) {
                if (id === myUID) continue;
                const p = list[id];
                if (otherPlayers[id]) {
                    otherPlayers[id].setLatLng([p.lat, p.lng]);
                } else {
                    otherPlayers[id] = L.marker([p.lat, p.lng], {
                        icon: L.divIcon({ 
                            className: 'other-marker', 
                            html: `<div style="background:${p.color}; width:100%; height:100%; border-radius:50%;"></div>`
                        })
                    }).addTo(map);
                }
            }
            // Удаление отключившихся
            for (let id in otherPlayers) {
                if (!list[id]) { map.removeLayer(otherPlayers[id]); delete otherPlayers[id]; }
            }
        });

        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });

        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
