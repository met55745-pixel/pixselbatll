<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka | Mobile Elite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --dark: #121212;
            --glass: rgba(30, 30, 30, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--dark); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Верхняя плашка статистики */
        .header-ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            z-index: 1000; display: flex; justify-content: space-between; align-items: center;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); opacity: 0.8; }
        .stat-val { font-size: 16px; font-weight: 800; margin-top: 2px; }

        /* Нижняя панель управления */
        .bottom-ui {
            position: absolute; bottom: 30px; left: 15px; right: 15px;
            z-index: 1000; display: flex; flex-direction: column; gap: 15px;
        }

        .color-picker {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px;
        }

        .color-node {
            width: 42px; height: 42px; border-radius: 50%;
            border: 3px solid transparent; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .color-node.active { border-color: white; transform: scale(1.2); }
        .color-node.active::after {
            content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: white; border-radius: 50%;
        }

        /* Анимация маркера игрока */
        .my-marker {
            width: 20px; height: 20px; background: white; border-radius: 50%;
            border: 4px solid var(--accent); box-shadow: 0 0 25px var(--accent);
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
            50% { transform: scale(1.2); box-shadow: 0 0 25px var(--accent); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
        }

        .other-marker { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="glass-card stat-item">
            <div class="stat-label">Онлайн</div>
            <div class="stat-val" id="online-count">0</div>
        </div>
        <div class="glass-card stat-item">
            <div class="stat-label">Твой Счет</div>
            <div class="stat-val" id="my-score">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-ui">
        <div class="glass-card color-picker">
            <div class="color-node active" onclick="setCol('#ff4757', this)" style="background: #ff4757;"></div>
            <div class="color-node" onclick="setCol('#2ed573', this)" style="background: #2ed573;"></div>
            <div class="color-node" onclick="setCol('#1e90ff', this)" style="background: #1e90ff;"></div>
            <div class="color-node" onclick="setCol('#ffa502', this)" style="background: #ffa502;"></div>
            <div class="color-node" onclick="setCol('#a29bfe', this)" style="background: #a29bfe;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const gridSize = 0.0004;
        let myUID = localStorage.getItem('p_uid') || 'PLAYER-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('p_uid', myUID);

        let currentColor = '#ff4757';
        let pixels = {};
        let otherPlayers = {};
        let myMarker = null;
        let fullMapData = {};

        const map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            doubleClickZoom: false,
            zoomSnap: 0.1
        }).setView([66.53, 66.61], 16);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function setCol(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-node').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        socket.on('init_map', (data) => {
            fullMapData = data;
            for (let id in data) drawRect(id, data[id].color);
            updateScore();
        });

        socket.on('pixel_updated', (data) => {
            fullMapData[data.id] = { color: data.color, owner: data.uid };
            drawRect(data.id, data.color);
            updateScore();
        });

        function drawRect(id, color) {
            if (pixels[id]) map.removeLayer(pixels[id]);
            const [lat, lng] = id.split('_').map(Number);
            pixels[id] = L.rectangle([[lat, lng], [lat + gridSize, lng + gridSize]], {
                color: color, fillColor: color, fillOpacity: 0.5, weight: 0
            }).addTo(map);
        }

        function updateScore() {
            let count = 0;
            for (let id in fullMapData) {
                if (fullMapData[id].owner === myUID) count++;
            }
            document.getElementById('my-score').innerText = count;
        }

        // GPS СИСТЕМА
        map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 1000 });

        map.on('locationfound', (e) => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (!myMarker) {
                myMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'my-marker', iconSize: [20, 20] })
                }).addTo(map);
                map.setView([lat, lng], 17);
            } else {
                myMarker.setLatLng([lat, lng]);
            }

            socket.emit('update_position', { uid: myUID, lat, lng, color: currentColor });

            const gLat = Math.floor(lat / gridSize) * gridSize;
            const gLng = Math.floor(lng / gridSize) * gridSize;
            const pId = `${gLat.toFixed(5)}_${gLng.toFixed(5)}`;
            socket.emit('paint_pixel', { id: pId, color: currentColor, uid: myUID });
        });

        socket.on('players_nearby', (list) => {
            for (let id in list) {
                if (id === myUID) continue;
                const p = list[id];
                if (otherPlayers[id]) {
                    otherPlayers[id].setLatLng([p.lat, p.lng]);
                } else {
                    otherPlayers[id] = L.marker([p.lat, p.lng], {
                        icon: L.divIcon({ 
                            className: 'other-marker', 
                            html: `<div style="background:${p.color}; width:100%; height:100%; border-radius:50%;"></div>`,
                            iconSize: [14, 14] 
                        })
                    }).addTo(map);
                }
            }
            for (let id in otherPlayers) {
                if (!list[id]) { map.removeLayer(otherPlayers[id]); delete otherPlayers[id]; }
            }
        });

        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });

        // Блокировка сна экрана
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
