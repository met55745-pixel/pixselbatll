<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --dark: #121212;
            --glass: rgba(30, 30, 30, 0.85);
            --border: rgba(255, 255, 255, 0.15);
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--dark); overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #000; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .header-ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            z-index: 1000; display: flex; gap: 10px;
        }

        .stat-box { flex: 1; padding: 10px; text-align: center; color: white; font-family: sans-serif; }
        .stat-label { font-size: 9px; text-transform: uppercase; opacity: 0.6; margin-bottom: 2px; }
        .stat-val { font-size: 16px; font-weight: 800; }

        .bottom-ui {
            position: absolute; bottom: 25px; left: 15px; right: 15px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }

        .color-picker { display: flex; justify-content: space-around; padding: 12px; }
        .color-node {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid transparent; transition: 0.2s;
        }
        .color-node.active { border-color: white; transform: scale(1.1); }

        .red-dot {
            width: 14px; height: 14px; background: #ff4757; 
            border: 3px solid white; border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
        }

        .locate-btn {
            position: absolute; right: 15px; bottom: 110px;
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 1000; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="glass-card stat-box">
            <div class="stat-label">Онлайн</div>
            <div class="stat-val" id="online-count">0</div>
        </div>
        <div class="glass-card stat-box">
            <div class="stat-label">Твои зоны</div>
            <div class="stat-val" id="my-score">0</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="glass-card locate-btn" onclick="recenter()">📍</div>

    <div class="bottom-ui">
        <div class="glass-card color-picker">
            <div class="color-node active" onclick="setCol('#ff4757', this)" style="background: #ff4757;"></div>
            <div class="color-node" onclick="setCol('#2ed573', this)" style="background: #2ed573;"></div>
            <div class="color-node" onclick="setCol('#1e90ff', this)" style="background: #1e90ff;"></div>
            <div class="color-node" onclick="setCol('#ffa502', this)" style="background: #ffa502;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    
    <script>
        // ИСПРАВЛЕННЫЙ АДРЕС СЕРВЕРА
        const socket = io('https://pixselbatll.onrender.com');
        
        const gridSize = 0.0003; 
        let myUID = localStorage.getItem('p_uid') || 'U' + Math.floor(Math.random()*9999);
        localStorage.setItem('p_uid', myUID);

        let currentColor = '#ff4757';
        let pixels = {};
        let myMarker = null;
        let lastPos = null;
        let fullMapData = {};

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([66.53, 66.61], 17);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function setCol(c, el) {
            currentColor = c;
            document.querySelectorAll('.color-node').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function recenter() { if (lastPos) map.flyTo(lastPos, 18); }

        function drawRect(id, color) {
            if (pixels[id]) map.removeLayer(pixels[id]);
            const [lat, lng] = id.split('_').map(Number);
            pixels[id] = L.rectangle([[lat, lng], [lat + gridSize, lng + gridSize]], {
                color: color, fillColor: color, fillOpacity: 0.4, weight: 0, interactive: false
            }).addTo(map);
        }

        socket.on('init_map', (data) => {
            fullMapData = data;
            for (let id in data) drawRect(id, data[id].color);
            updateScore();
        });

        socket.on('pixel_updated', (data) => {
            fullMapData[data.id] = { color: data.color, owner: data.uid };
            drawRect(data.id, data.color);
            updateScore();
        });

        function updateScore() {
            let count = Object.values(fullMapData).filter(p => p.owner === myUID).length;
            document.getElementById('my-score').innerText = count;
        }

        map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 0 });

        map.on('locationfound', (e) => {
            const { lat, lng } = e.latlng;
            lastPos = e.latlng;

            if (!myMarker) {
                myMarker = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'red-dot', iconSize: [14, 14] }),
                    zIndexOffset: 1000
                }).addTo(map);
                map.setView([lat, lng], 18);
            } else {
                myMarker.setLatLng([lat, lng]);
            }

            socket.emit('update_position', { uid: myUID, lat, lng, color: currentColor });

            const gLat = Math.floor(lat / gridSize) * gridSize;
            const gLng = Math.floor(lng / gridSize) * gridSize;
            const pId = `${gLat.toFixed(6)}_${gLng.toFixed(6)}`;
            
            if (!fullMapData[pId] || fullMapData[pId].owner !== myUID) {
                socket.emit('paint_pixel', { id: pId, color: currentColor, uid: myUID });
            }
        });

        socket.on('online_stats', (count) => { document.getElementById('online-count').innerText = count; });
    </script>
</body>
</html>
